name: Update External Docs

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点运行
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync plugin docs, changelog and downloads
        env:
          HTMLTEXT_GITHUB_TOKEN: ${{ secrets.HTMLTEXT_GITHUB_TOKEN || github.token }}
          HTMLTEXT_GITHUB_REPO: chenyomi/npm-chenyomi-leafer-htmltext-edit
          HTMLTEXT_DISABLE_LOCAL: '1'
        run: pnpm run docs:sync-all

      - name: Commit and push synced files
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/content/docs/ src/pages/DocsPage.vue public/downloads/
          if git diff --staged --quiet; then
            echo "No synced changes to commit."
          else
            git commit -m "docs: sync external plugin docs and downloads"
            git push
          fi

      - name: Build project
        run: pnpm run build

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Copy index.html to 404.html
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
